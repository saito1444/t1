<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>非接触生体信号解析自律診断システム</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 14px;
      background: #06080e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background 0.8s ease;
    }

    body.theme-amber { background: #261304 !important; }
    body.theme-cyan { background: #031b29 !important; }
    body.theme-emerald { background: #032415 !important; }

    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .header h1 {
      font-size: 13px;
      margin: 0;
      letter-spacing: 0.05em;
      color: #38bdf8;
      font-weight: 700;
    }
    .badge {
      font-size: 10px;
      background: #020617;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .mode-selector {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mode-tab {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 700;
    }

    .scanner-box {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 240px;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      border: 2px solid #1e293b;
      transition: border-color 0.8s ease, box-shadow 0.8s ease;
    }
    video, #outputCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .silhouette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .silhouette-svg {
      width: 170px;
      height: 210px;
      fill: none;
      stroke: rgba(56, 189, 248, 0.4);
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      transition: stroke 0.4s ease;
    }
    .guide-hint {
      position: absolute;
      bottom: 8px;
      font-size: 10px;
      color: #38bdf8;
      background: rgba(2, 6, 23, 0.85);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* リアルタイム血流増幅インジケータ */
    .pulse-indicator {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 9px;
      color: #38bdf8;
      background: rgba(2, 6, 23, 0.85);
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      z-index: 7;
      display: none;
    }

    .scan-line {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 10px #38bdf8;
      animation: scan 2.5s infinite linear;
      z-index: 6;
      display: none;
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .progress-bar-container {
      width: 100%;
      max-width: 380px;
      height: 4px;
      background: #1e293b;
      margin-top: 6px;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.15s linear;
    }

    .waveform-panel {
      width: 100%;
      max-width: 380px;
      height: 60px;
      background: #02050c;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-top: 8px;
      position: relative;
    }
    #waveCanvas { width: 100%; height: 100%; }

    .metrics-grid {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .metric-card {
      background: rgba(15, 20, 31, 0.85);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .metric-card span { font-size: 9px; color: #94a3b8; display: block; margin-bottom: 2px; }
    .metric-card strong { font-size: 15px; color: #f1f5f9; font-family: monospace; }
    .val-accent { color: #38bdf8; }

    .agent-action-card {
      width: 100%;
      max-width: 380px;
      background: rgba(2, 6, 23, 0.9);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      display: none;
      border: 2px solid #38bdf8;
    }
    .agent-action-header {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 4px;
    }
    .agent-action-list {
      font-size: 11px;
      color: #f8fafc;
      line-height: 1.5;
    }

    .report-card {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 20, 31, 0.9);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      display: none;
    }
    .report-title {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 4px;
    }
    .report-section {
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.6;
    }
    .report-section strong {
      color: #38bdf8;
      display: block;
      margin-bottom: 2px;
    }
    .timeline-box {
      background: rgba(2, 6, 23, 0.7);
      border-left: 2px solid #38bdf8;
      padding: 6px 10px;
      margin-top: 4px;
      border-radius: 0 6px 6px 0;
    }
    .timeline-item {
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .timeline-item:last-child { margin-bottom: 0; }

    .reference-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
      font-size: 9px;
      color: #64748b;
      line-height: 1.4;
    }
    .reference-box span {
      display: block;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .btn-action {
      width: 100%;
      max-width: 380px;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-action:disabled {
      background: #334155;
      color: #64748b;
    }

    .btn-reset {
      display: none;
      width: 100%;
      max-width: 380px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>非接触生体解析自律診断</h1>
    <div class="badge" id="currentModeBadge">10秒 クイック</div>
  </div>

  <div class="mode-selector">
    <div class="mode-tab active" id="mode10" onclick="setMeasureMode(10)">
      <strong>10秒 体験モード</strong><br>
      <span style="font-size:9px;">展示向け・簡易判定</span>
    </div>
    <div class="mode-tab" id="mode60" onclick="setMeasureMode(60)">
      <strong>60秒 学術精度モード</strong><br>
      <span style="font-size:9px;">Task Force基準準拠</span>
    </div>
  </div>

  <div class="scanner-box" id="scannerBox">
    <video id="inputVideo" playsinline autoplay muted></video>
    <canvas id="outputCanvas"></canvas>
    
    <div class="pulse-indicator" id="pulseIndicator">血流脈動 50倍増幅可視化中</div>

    <div class="silhouette-overlay">
      <svg class="silhouette-svg" id="silhouetteSvg" viewBox="0 0 100 125">
        <ellipse cx="50" cy="40" rx="22" ry="28" />
        <path d="M 38 66 C 36 76 22 84 8 98 L 8 125 L 92 125 L 92 98 C 78 84 64 76 62 66" />
      </svg>
      <div class="guide-hint" id="guideHint">枠内に顔を合わせてください</div>
    </div>

    <div class="scan-line" id="scanLine"></div>
  </div>

  <div class="progress-bar-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="waveform-panel">
    <canvas id="waveCanvas"></canvas>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <span>推定心拍数</span>
      <strong id="bpmVal" class="val-accent">--</strong>
    </div>
    <div class="metric-card">
      <span>自律神経ゆらぎ (HRV)</span>
      <strong id="hrvVal" class="val-accent">--</strong>
    </div>
    <div class="metric-card">
      <span>自律神経バランス</span>
      <strong id="stateVal" style="font-size:12px;">待機中</strong>
    </div>
    <div class="metric-card">
      <span>体内負荷換算</span>
      <strong id="equivVal" style="font-size:12px;">--</strong>
    </div>
  </div>

  <div id="agentActionCard" class="agent-action-card">
    <div class="agent-action-header">
      <span id="agentStatusTitle">自律的端末制御を実行</span>
      <span id="toolNameDisplay">最適化処理完了</span>
    </div>
    <div id="agentActionList" class="agent-action-list"></div>
  </div>

  <div id="reportCard" class="report-card">
    <div class="report-title">
      <span>生体深層推論カルテ</span>
      <span id="reportTimestamp">--:--:--</span>
    </div>
    <div id="reportContent" class="report-content"></div>
  </div>

  <button id="startBtn" class="btn-action" onclick="startScanSession()">10秒間の生体計測を開始</button>
  <button id="resetEnvBtn" class="btn-reset" onclick="resetEnvironment()">画面の適応モードを解除</button>

  <script>

    const outputCanvas = document.getElementById('outputCanvas');
    const outCtx = outputCanvas.getContext('2d');
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');

    let cameraInstance = null;
    let isScanning = false;
    let scanStartTime = null;
    
    let currentModeSeconds = 10;
    let scanDurationMs = 10000;

    const rawSignals = [];
    const timestamps = [];
    const waveHistory = [];
    let currentWaveColor = '#38bdf8';

    let bp_x1 = 0, bp_
